<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Yashi 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 120px;
      font-size: 50px;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 20px;
      margin-top: 10px;
      animation: fadeIn 3s ease-in-out;
    }

    button {
      margin-top: 40px;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #ff4d6d;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff4d6d;
      color: white;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before { top: -10px; }
    .heart::after { left: -10px; }

    @keyframes float {
      0% { bottom: -10%; opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

  <h1>Happy Birthday Yashi 💖</h1>
  <p>Something special is waiting for you… ✨</p>

  <button onclick="goNext()">Click for Surprise 🎁</button>

  <script>
    function goNext() {
      window.location.href = "page2.html";
    }

    setInterval(() => {
      const heart = document.createElement("div");
      heart.classList.add("heart");

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 300);
  </script>

</body>
</html>
